name: Release-plz

# Fully automatic releases, driven by the Conventional Commits in this repo.
# See release-plz.toml for what bumps what.
#
# Every push to main cuts a release. `release-plz update` rewrites Cargo.toml,
# Cargo.lock and CHANGELOG.md in place; the new version is committed straight
# back to main, tagged `vX.Y.Z`, released, and the app bundle is attached.
# No release PR, nothing to click.
#
# Two GITHUB_TOKEN quirks shape this file, and both help here:
#   - GitHub refuses to start a workflow run from a push its own token made,
#     so the bump commit below cannot re-trigger this workflow. Do NOT swap in
#     a PAT: since every push releases, the release commit would release again,
#     for ever.
#   - For the same reason the tag push triggers nothing, so the `bundle` job
#     calls .github/workflows/release.yml directly.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: bump, tag and create the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # release-plz works out the last release from the `v*` tags.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.3

      - name: Apply the version bump and changelog entry
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          crate_version() { sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1; }
          before="$(crate_version)"
          release-plz update --forge github --git-token "$GITHUB_TOKEN"
          version="$(crate_version)"
          # Normally every push bumps. The exception is a version already ahead
          # of the tags — a hand-set 1.0.0, or a bump whose release failed —
          # where update only touches the changelog. The release step below
          # picks those up, so there is nothing to commit here.
          if [ "$before" = "$version" ]; then
            echo "No bump: staying on $before."
            git checkout -- .
            exit 0
          fi
          echo "Bumping $before -> $version."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Kept out of the changelog by release-plz.toml's commit parsers.
          # It cannot re-trigger this workflow either: see the top of the file.
          git commit -m "chore: release v${version}"
          git push origin HEAD:main

      - name: Tag and create the GitHub release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Unconditional on purpose. Besides the bump just committed, this is
          # what picks up a version set by hand in Cargo.toml (cutting 1.0.0)
          # and what recovers a bump whose release failed. release_always = true
          # lets it release any version that has no `v*` tag yet.
          output="$(release-plz release --forge github --git-token "$GITHUB_TOKEN" -o json)"
          echo "$output"
          tag="$(echo "$output" | jq -r '.releases[0].tag // ""')"
          if [ -z "$tag" ]; then
            echo "Nothing to release."
            echo "released=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Released $tag."
          echo "released=true" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  bundle:
    name: attach prtoolbar.app to the release
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    # Called directly rather than left to the tag push, which GITHUB_TOKEN
    # cannot trigger. See the comment at the top of this file.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
