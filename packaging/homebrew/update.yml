name: Update prtoolbar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-prtoolbar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAP_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish the latest completed app release
        run: python3 scripts/sync_homebrew.py --source kamikaze139/prtoolbar --repository "$TAP_REPOSITORY"
